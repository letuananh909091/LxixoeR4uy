name: Build and Deploy

on:
  push:
    branches:
      - frontend
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend branch
        uses: actions/checkout@v4
        with:
          ref: frontend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Build the application
        run: npm run build

      - name: Verify dist folder exists
        run: |
          if [ ! -d "dist" ]; then
            echo "Dist folder not found!";
            exit 1;
          fi

      - name: Verify essential files exist
        run: |
          if [ ! -f "app.py" ]; then
            echo "app.py not found!";
            exit 1;
          fi
          if [ ! -f "README.md" ]; then
            echo "README.md not found!";
            exit 1;
          fi

      - name: Fetch all branches
        run: git fetch --all

      - name: Checkout vps branch
        uses: actions/checkout@v4
        with:
          ref: vps

      - name: Sync files to vps branch
        run: |
          rm -rf dist
          cp -r ../frontend/dist .
          cp ../frontend/app.py .
          cp ../frontend/README.md .

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add dist app.py README.md
          git commit -m "Build and deploy new dist files"
          git push origin vps
